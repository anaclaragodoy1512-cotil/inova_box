<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<!-- ⬆código de um estilo de fontes, do google fontes!-->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Livros</title>
    <link rel="icon" type="image/png" href="livro.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:  #d0f4de;
            margin: 0;
            padding-top: 60px; /* Garante que o menu fixo não cubra o conteúdo */
        }

        .lobster-two-regular {
            text-align: center;
            color: mediumpurple;
            font-size: 60px;
            margin: 20px 0;
            font-family: "Lobster Two", sans-serif;
            font-weight: 400;
            font-style: normal;


        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            width: 400px;
            margin: 0 auto 40px auto;
            box-shadow: 10px 10px 10px lightgray;
        }

        fieldset {
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            color: blueviolet;
            padding: 0 5px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        /* Seletor atualizado para incluir todos os tipos de input do formulário */
        input[type="text"], 
        input[type="email"], 
        input[type="date"], 
        input[type="number"], 
        input[type="password"], 
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .radio-group {
            margin-top: 5px;
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        button {
            margin-top: 10px;
            padding: 12px 15px;
            background-color: mediumpurple;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;   
        }

        button:hover {
            background-color: hotpink;
            box-shadow: 5px 5px #cccccc;
            border-radius: 10px;
        }

       #menu  {
		 	position: fixed;
		 	top: 0px;
		 	left: 0px;
		 	width: 100%;
		 	font-size: 25px;
        	background-color: #1b4965;
        	color:#a2d2ff;
        	padding: 5px;
        	text-align: center;
        	letter-spacing: 2px ;
        	word-spacing: 15px;
        	
		}
		#menu a {
			color: white;
		}

        #menu a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="menu">
        <a href="index.html">Página Inicial |
 </a>
        <a href="Inova_Study.html">Inova_Study</a> |
        Cadastro
    </div>

    <h1 class="lobster-two-regular">Formulário de Cadastro</h1>

    <form>
        <fieldset>
            <legend>Cadastro</legend>
            
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" required placeholder="Nome Completo">

            <label>Sexo:</label>

            <div class="radio-group">
                <input type="radio" name="sexo" id="sexo-m" value="M"> <label style="display:inline; font-weight:normal;" for="sexo-m">M</label>
                <input type="radio" name="sexo" id="sexo-f" value="F"> <label style="display:inline; font-weight:normal;" for="sexo-f">F</label>
            </div>

            <label for="idade">Idade:</label>
            <input type="number" name="idade" id="idade" min="14" max="120">

            <label for="data">Data de Nascimento:</label>
            <input type="date" name="data" id="data">

            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email">
        </fieldset>

        <fieldset>
            <legend>Login</legend>
            
            <label for="login">Login:</label>
            <input type="text" name="login" id="login" minlength="8" maxlength="10">

            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" minlength="6" maxlength="12">

            <label for="message">Mensagem:</label>
            <textarea id="message" name="message" placeholder="digite aqui sua mensagem"></textarea>
        </fieldset>

        <button type="submit" onclick="alert('Seu cadastro foi realizado com sucesso!')">
            <span>Salvar</span>
        </button>
    </form>

</body>
</html>
